<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ensalada - Landing Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { opacity: 0; transform: translateY(20px); transition: all 0.6s ease-out; }
        .fade-in.visible { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="bg-white text-gray-900">

    <nav class="fixed w-full bg-white/80 backdrop-blur-md z-50 border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-2xl font-bold tracking-tighter">ENSALADA</div>
            <div class="hidden md:flex space-x-8 font-medium text-sm">
                <a href="#inicio" class="hover:text-green-600 transition">Inicio</a>
                <a href="#servicios" class="hover:text-green-600 transition">Servicios</a>
                <a href="#contacto" class="bg-black text-white px-4 py-2 rounded-full hover:bg-gray-800 transition">Contacto</a>
            </div>
        </div>
    </nav>

    <section id="inicio" class="pt-32 pb-20 px-6">
        <div class="max-w-4xl mx-auto text-center fade-in">
            <h1 class="text-5xl md:text-7xl font-bold leading-tight mb-6">
                Creamos contenido que <span class="text-green-600">alimenta</span> tu marca.
            </h1>
            <p class="text-xl text-gray-500 mb-10">Agencia creativa enfocada en potenciar tu presencia digital con estrategia y diseño.</p>
            <a href="#contacto" class="inline-block bg-green-600 text-white px-8 py-4 rounded-lg font-bold text-lg hover:shadow-lg transition">Trabajemos juntos</a>
        </div>
    </section>

    <section id="contacto" class="py-20 bg-gray-50 px-6">
        <div class="max-w-xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-gray-100 fade-in">
            <h2 class="text-3xl font-bold mb-2">Hablemos</h2>
            <p class="text-gray-500 mb-8">Contanos sobre tu proyecto y nos pondremos en contacto a la brevedad.</p>
            
            <form id="contactForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Nombre</label>
                    <input type="text" id="name" required class="w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Email</label>
                    <input type="email" id="email" required class="w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">Mensaje</label>
                    <textarea id="message" rows="4" required class="w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 outline-none transition"></textarea>
                </div>
                <button type="submit" class="w-full bg-black text-white font-bold py-4 rounded-lg hover:bg-gray-900 transition flex justify-center items-center">
                    <span id="btnText">Enviar Solicitud</span>
                </button>
            </form>
            <div id="responseMsg" class="mt-4 hidden text-center font-medium"></div>
        </div>
    </section>

    <script src="js/main.js"></script>
</body>
</html>
